
<!-- ===== CALENDAR PAGE ===== -->

<!DOCTYPE html>
<html lang="en">

<head>

    <!-- ===== PAGE SETTINGS ===== -->

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>Calendar - Smart Attendance</title>


    <!-- ===== ICONS ===== -->

    <link
        rel="stylesheet"
        href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css"
    >


    <!-- ===== CALENDAR CSS ===== -->

    <link
        rel="stylesheet"
        href="{{ url_for('static', filename='css/calendar.css') }}"
    >

</head>


<body>

    <!-- ===== MAIN PAGE ===== -->

    <div class="calendar-page">


        <!-- ===== PAGE HEADER ===== -->

        <div class="page-header">

            <div>

                <p class="page-label">
                    ATTENDANCE SCHEDULE
                </p>

                <h1>
                    Calendar
                </h1>

                <p class="page-description">
                    View lectures and attendance sessions by date.
                </p>

            </div>


            <!-- ===== TODAY BUTTON ===== -->

            <button
                class="today-button"
                id="todayButton"
            >
                Today
            </button>

        </div>



        <!-- ===== CALENDAR CARD ===== -->

        <div class="calendar-card">


            <!-- ===== MONTH HEADER ===== -->

            <div class="calendar-header">

                <button
                    class="calendar-nav"
                    id="previousMonth"
                >

                    <i class="bi bi-chevron-left"></i>

                </button>


                <h2 id="monthTitle">
                    August 2026
                </h2>


                <button
                    class="calendar-nav"
                    id="nextMonth"
                >

                    <i class="bi bi-chevron-right"></i>

                </button>

            </div>



            <!-- ===== WEEK DAYS ===== -->

            <div class="week-days">

                <div>Sun</div>
                <div>Mon</div>
                <div>Tue</div>
                <div>Wed</div>
                <div>Thu</div>
                <div>Fri</div>
                <div>Sat</div>

            </div>



            <!-- ===== CALENDAR DAYS ===== -->

            <div
                class="calendar-grid"
                id="calendarGrid"
            >

                <!-- JS adds calendar days here -->

            </div>

        </div>



        <!-- ===== RECENT SESSIONS ===== -->

        <div class="sessions-card">

            <h2>
                Recent Sessions
            </h2>

            <p>
                Attendance sessions recorded recently.
            </p>


            <div id="recentSessionsList">

            </div>


            <!-- ===== SESSION DETAIL (on date click) ===== -->

            <div id="sessionDetail"
                 class="session-detail"
                 style="display:none;">

                <div class="detail-heading">

                    <h3 id="detailTitle">
                        Session Details
                    </h3>

                    <button
                        class="close-detail"
                        id="closeDetail"
                    >
                        ×
                    </button>

                </div>

                <div id="detailBody"
                     class="detail-body">

                </div>

            </div>

        </div>


    </div>


    <!-- ===== CALENDAR JS ===== -->

    <script
        src="{{ url_for('static', filename='js/calendar.js') }}"
    ></script>

</body>

</html>
